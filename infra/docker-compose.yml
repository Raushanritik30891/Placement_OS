services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # A production environment also needs PostgreSQL, migrations, a hardened
  # Judge0 deployment, TLS termination, backups, logging and monitoring.
